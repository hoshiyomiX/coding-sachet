name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-agent:
    # The Node agent server is the heart of the app: run its test suite first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Agent server tests (mock gateway)
        run: |
          cd app/src/main/assets/server
          node --test test/*.test.js

  apk:
    needs: test-agent
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          set -e
          AH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$AH/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$AH/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKM="sdkmanager"
          else
            mkdir -p "$AH/cmdline-tools/latest"
            curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/ctl.zip
            unzip -q /tmp/ctl.zip -d /tmp/ctl
            mv /tmp/ctl/cmdline-tools/* "$AH/cmdline-tools/latest/"
            SDKM="$AH/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37.0" > /dev/null
          "$SDKM" --install "build-tools;37.0.0" > /dev/null 2>&1 || echo "build-tools;37.0.0 tidak tersedia — AGP akan pakai versi default"
          [ -d "$AH/platforms/android-37.0" ] || { echo "FATAL: platform android-37.0 tidak terpasang"; exit 1; }
          echo "ANDROID_HOME=$AH" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install cross binutils (strip biner node per-arch)
        # T-ML46: bin/node resmi TIDAK stripped (debug_info ~36MB). Strip
        # lintas-arch butuh binutils target; x86_64 pakai strip sistem.
        run: sudo apt-get install -y -qq binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf

      - name: Kotlin unit tests
        # App-logic tests (providers, wire format, localization parity) run
        # BEFORE any APK is assembled — a red test must fail the build early.
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build one APK per ABI (split ABI)
        run: |
          set -e
          N="$GITHUB_RUN_NUMBER"
          VERSION="1.0.$N"
          #        ABI            guest triplet          node ver   node arch  verCode idx
          MATRIX="arm64-v8a|aarch64-linux-gnu|26.13.0|arm64|1
          armeabi-v7a|arm-linux-gnueabihf|22.20.0|armv7l|2
          x86_64|x86_64-linux-gnu|26.13.0|x64|3"
          #          rootfs arch | ubuntu-base 24.04.5 sha256
          ubuntu_sha() {
            case "$1" in
              arm64) echo a91d5a93010193712d346d761372b7c9db6dfcf093893161c64ca107f05914f2 ;;
              armhf) echo 4fcee4d278f1c5232e085a021a85e4c6cef3853557a88d98ff380b5e5d5841bb ;;
              amd64) echo e77b6f10c2590cef872b33ee9f635a0e3fd1f57fb074c0e52b5c7f56147a0c86 ;;
            esac
          }
          #          node tarball sha256 (versi+arch)
          node_sha() {
            case "$1/$2" in
              26.13.0/arm64)  echo 406fe3fbde1c054adff8b297c16fdb5af6659db327c1ac8acd46b56ef1af9a92 ;;
              26.13.0/x64)    echo d28a96af6c38596f6d9d97c0ee531c13d238d757742387d1928de822d959e997 ;;
              22.20.0/armv7l) echo c599a33d91c9a39b7de3319929948f91f6ac42afaa1417f4340a5cc1b2efceda ;;
            esac
          }

          echo "$MATRIX" | while IFS='|' read -r ABI TRIPLET NODEVER NODEARCH IDX; do
            [ -n "$ABI" ] || continue
            case "$ABI" in
              arm64-v8a)    UB_ARCH=arm64 ; BCJ=arm64 ;;
              armeabi-v7a)  UB_ARCH=armhf ; BCJ=armthumb ;;
              x86_64)       UB_ARCH=amd64 ; BCJ=x86 ;;
            esac
            # T-ML47: xz filter chain = arch-specific BCJ branch filter +
            # LZMA2 9e. BCJ pre-transforms branch instructions so LZMA2
            # matches them: ~4-5% smaller than plain -9e on the arm64 ELF
            # payloads, decoded fine by the app's org.tukaani:xz 1.10
            # (ARM64Options) — verified byte-identical against system xz.
            XZFILT="${BCJ} lzma2:preset=9e,dict=64MiB"
            echo "===== ABI $ABI (rootfs $UB_ARCH, node v$NODEVER-$NODEARCH, idx $IDX) ====="
            mkdir -p app/src/main/assets/env
            UB_PATH="ubuntu-base/releases/24.04/release/ubuntu-base-24.04.5-base-$UB_ARCH.tar.gz"
            UB_WANT="$(ubuntu_sha "$UB_ARCH")"
            UB_OK=""
            # cdimage.ubuntu.com went DNS-dark from GitHub runners on
            # 2026-11-11 (3 runs in 12 minutes, "Could not resolve host"
            # every attempt while other hosts resolved fine) — the tarball
            # is sha256-pinned per attempt, so any mirror serving the same
            # bytes is safe: canonical host first, then verified mirrors.
            for HOST in cdimage.ubuntu.com mirrors.tuna.tsinghua.edu.cn/ubuntu-cdimage mirrors.ustc.edu.cn/ubuntu-cdimage; do
              for i in 1 2; do
                if curl -sSL --connect-timeout 20 --max-time 240 -o /tmp/ubuntu.tar.gz "https://$HOST/$UB_PATH" \
                   && echo "$UB_WANT  /tmp/ubuntu.tar.gz" | sha256sum -c -; then
                  UB_OK="$HOST"; break 2
                fi
                echo "retry ubuntu via $HOST ($i)"; sleep 5
              done
            done
            [ -n "$UB_OK" ] || { echo "FATAL: ubuntu-base $UB_ARCH gagal dari semua mirror"; exit 1; }
            echo "ubuntu-base $UB_ARCH dari $UB_OK"
            # Bake git into the rootfs (T-ML31 P0-3): 6/6 field server-kills
            # started with the model running apt to install git (dpkg
            # maintainer scripts = peak memory under proot -> kernel OOM
            # killer picks node). git + its runtime library closure are
            # RESOLVED against this very rootfs's dpkg status (apt with Dir
            # overrides — no chroot/qemu needed), downloaded, and extracted
            # with dpkg-deb -x --root-ownergroup: no maintainer scripts ever
            # run, no dpkg state is touched, the guest just gets /usr/bin/git.
            ROOTFS=/tmp/rootfs-$UB_ARCH
            mkdir -p "$ROOTFS"
            tar -xzf /tmp/ubuntu.tar.gz -C "$ROOTFS"
            mkdir -p "$ROOTFS/var/lib/apt/lists/partial" "$ROOTFS/var/cache/apt/archives/partial"
            # Keyring dari rootfs itu sendiri (deterministik, tanpa sudo):
            # ubuntu-base selalu membawa ubuntu-archive-keyring.gpg.
            TRUSTED="$ROOTFS/usr/share/keyrings/ubuntu-archive-keyring.gpg"
            [ -f "$TRUSTED" ] || { echo "FATAL: keyring ubuntu hilang dari rootfs"; exit 1; }
            cat > /tmp/git-sources.list <<EOF
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main universe
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports noble main universe
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe
          EOF
            APTOPTS=( -o Dir="$ROOTFS"
              -o Dir::State::status="$ROOTFS/var/lib/dpkg/status"
              -o Dir::Etc::sourcelist=/tmp/git-sources.list
              -o Dir::Etc::sourceparts=-
              -o Dir::Etc::trusted="$TRUSTED"
              -o Dir::Etc::trustedparts=-
              -o APT::Architecture="$UB_ARCH"
              -o APT::Architectures="$UB_ARCH"
              -o Acquire::Languages=none )
            for i in 1 2 3; do
              apt-get "${APTOPTS[@]}" update && break || { echo "retry apt update ($i)"; sleep 5; }
            done
            apt-get "${APTOPTS[@]}" install -y --no-install-recommends --download-only git
            set -- "$ROOTFS"/var/cache/apt/archives/*.deb
            echo "git closure: $# paket"
            [ "$#" -ge 5 ] || { echo "FATAL: closure git < 5 paket"; exit 1; }
            for deb in "$@"; do dpkg-deb -x --root-owner-group "$deb" "$ROOTFS"; done
            # Purge EVERYTHING apt left behind: the downloaded .debs, the
            # lock, and above all pkgcache.bin/srcpkgcache.bin — the runner's
            # apt 2.7 builds those ~99 MB binary caches inside Dir::Cache
            # (run #31 shipped them: rootfs asset 75 MB instead of ~30 MB).
            # The pristine archives/partial skeleton is recreated after.
            rm -rf "$ROOTFS"/var/cache/apt/*
            mkdir -p "$ROOTFS"/var/cache/apt/archives/partial
            rm -rf "$ROOTFS"/var/lib/apt/lists/*
            [ -x "$ROOTFS/usr/bin/git" ] || { echo "FATAL: /usr/bin/git tidak ada di rootfs"; exit 1; }
            [ -d "$ROOTFS/usr/lib/git-core" ] || { echo "FATAL: /usr/lib/git-core hilang"; exit 1; }
            # Prune rootfs (T-ML46, 31MB -> 22MB; T-ML47, 22MB -> 13.5MB):
            # T-ML46 dropped the full-perl tree (usr/lib/<t>/perl,
            # usr/share/perl, ~50MB raw) plus doc/man/locale/include.
            # T-ML47 goes further — perl-base itself is now gone too:
            # only git's exotic subcommands (send-email, svn, add
            # --interactive) ever needed it, same risk class as python3
            # which was never bundled. Also dropped: glibc gconv charset
            # tables (~20MB — the guest stack is UTF-8-native), apt+dpkg+gpgv
            # (guest never installs packages), usr/sbin (fsck/shadow/getty —
            # meaningless under proot; ldconfig kept), PAM+systemd+udev and
            # all libs with zero remaining ELF users (verified by NEEDED
            # closure scan), libssl/ossl-modules (coreutils only need
            # libcrypto's default provider), terminfo trimmed to headless
            # essentials, git-shell/localedef/tic/lsblk orphans.
            # KEPT on purpose: procps (ps/top/pgrep — agent debugging) via
            # libproc2 -> libsystemd -> libgcrypt chain, and libcurl's
            # libldap/libsasl2 (NEEDED entries must resolve or curl won't
            # load at all).
            rm -rf "$ROOTFS"/usr/lib/*/gconv \
                   "$ROOTFS"/usr/lib/*/perl \
                   "$ROOTFS"/usr/lib/*/perl-base \
                   "$ROOTFS"/usr/share/perl \
                   "$ROOTFS"/usr/share/perl5 \
                   "$ROOTFS"/usr/share/doc \
                   "$ROOTFS"/usr/share/man \
                   "$ROOTFS"/usr/share/locale \
                   "$ROOTFS"/usr/include
            rm -f  "$ROOTFS"/usr/bin/perl* \
                   "$ROOTFS"/usr/bin/apt* \
                   "$ROOTFS"/usr/bin/dpkg* \
                   "$ROOTFS"/usr/bin/gpgv \
                   "$ROOTFS"/usr/bin/git-shell \
                   "$ROOTFS"/usr/bin/localedef \
                   "$ROOTFS"/usr/bin/tic \
                   "$ROOTFS"/usr/bin/lsblk \
                   "$ROOTFS"/usr/bin/su \
                   "$ROOTFS"/usr/bin/login \
                   "$ROOTFS"/usr/bin/passwd \
                   "$ROOTFS"/usr/bin/chsh \
                   "$ROOTFS"/usr/bin/chfn \
                   "$ROOTFS"/usr/bin/lslogins \
                   "$ROOTFS"/usr/bin/logger \
                   "$ROOTFS"/usr/bin/w \
                   "$ROOTFS"/usr/bin/findmnt
            rm -rf "$ROOTFS"/usr/lib/apt \
                   "$ROOTFS"/usr/lib/dpkg \
                   "$ROOTFS"/var/lib/dpkg \
                   "$ROOTFS"/usr/lib/*/security \
                   "$ROOTFS"/usr/lib/*/sasl2 \
                   "$ROOTFS"/usr/lib/systemd \
                   "$ROOTFS"/usr/lib/udev \
                   "$ROOTFS"/usr/lib/*/ossl-modules \
                   "$ROOTFS"/usr/lib/*/engines-3 \
                   "$ROOTFS"/usr/share/ca-certificates \
                   "$ROOTFS"/usr/share/tabset \
                   "$ROOTFS"/usr/share/misc \
                   "$ROOTFS"/usr/share/pixmaps \
                   "$ROOTFS"/usr/share/polkit-1 \
                   "$ROOTFS"/usr/share/sensible-utils \
                   "$ROOTFS"/usr/share/util-linux \
                   "$ROOTFS"/usr/share/staff-group-for-usr-local \
                   "$ROOTFS"/usr/share/pam* \
                   "$ROOTFS"/usr/share/profile.md5sums
            rm -f  "$ROOTFS"/usr/lib/*/libperl.so* \
                   "$ROOTFS"/usr/lib/*/libapt-pkg.so* \
                   "$ROOTFS"/usr/lib/*/libapt-private.so* \
                   "$ROOTFS"/usr/lib/*/libpam*.so* \
                   "$ROOTFS"/usr/lib/*/libudev*.so* \
                   "$ROOTFS"/usr/lib/*/libbsd.so* \
                   "$ROOTFS"/usr/lib/*/libmd.so* \
                   "$ROOTFS"/usr/lib/*/libevent*.so* \
                   "$ROOTFS"/usr/lib/*/libdb-5.3.so \
                   "$ROOTFS"/usr/lib/*/libssl.so.3 \
                   "$ROOTFS"/usr/lib/*/libassuan.so*
            # DELIBERATELY KEPT (closure scan T-ML47): libgcrypt +
            # libgpg-error (libsystemd needs them), libsystemd (ps/top/pgrep
            # via libproc2), libldap + liblber + libsasl2 (libcurl-gnutls
            # NEEDED entries — unresolved sonames would stop curl from
            # loading at all), libcrypto (Ubuntu 24.04 coreutils *sum/sort
            # link it). Removing any of these breaks the guest stack.
            # usr/sbin: everything there is meaningless under proot (block
            # devices, fsck, shadow/user management, getty) — keep ldconfig
            # only.
            find "$ROOTFS"/usr/sbin -mindepth 1 -maxdepth 1 \
              ! -name 'ldconfig' ! -name 'ldconfig.real' -exec rm -rf {} +
            # Purge EVERYTHING apt left behind: the downloaded .debs, the
            # lock, and above all pkgcache.bin/srcpkgcache.bin — the runner's
            # apt 2.7 builds those ~99 MB binary caches inside Dir::Cache
            # (run #31 shipped them: rootfs asset 75 MB instead of ~30 MB).
            # The pristine archives/partial skeleton is recreated after.
            # dpkg state goes too (T-ML47): no dpkg binary survives, the
            # guest cannot install packages anyway.
            rm -rf "$ROOTFS"/var/lib/dpkg
            rm -rf "$ROOTFS"/var/cache/apt/*
            mkdir -p "$ROOTFS"/var/cache/apt/archives/partial
            rm -rf "$ROOTFS"/var/lib/apt/lists/*
            # terminfo: keep only terminal families a headless guest meets.
            find "$ROOTFS"/usr/share/terminfo -mindepth 2 -type f \
              ! -name xterm ! -name xterm-256color ! -name xterm-color \
              ! -name linux ! -name screen ! -name screen-256color \
              ! -name vt100 ! -name vt102 ! -name vt220 ! -name ansi ! -name dumb \
              ! -name rxvt ! -name rxvt-unicode-256color \
              -delete
            find "$ROOTFS"/usr/share/terminfo -depth -type d -empty -delete
            # git deb ships usr/bin/git and git-core/git as ONE inode;
            # dpkg-deb -x breaks the hardlink and the tar stored the 4MB
            # payload twice. Re-link before archiving (T-ML47).
            ln -f "$ROOTFS"/usr/lib/git-core/git "$ROOTFS"/usr/bin/git
            [ -x "$ROOTFS/usr/bin/git" ] || { echo "FATAL: /usr/bin/git tidak ada di rootfs"; exit 1; }
            [ -d "$ROOTFS/usr/lib/git-core" ] || { echo "FATAL: /usr/lib/git-core hilang"; exit 1; }
            [ -f "$ROOTFS"/usr/lib/*/libsystemd.so.0 ] || { echo "FATAL: libsystemd (untuk ps/top) hilang"; exit 1; }
            [ -f "$ROOTFS"/usr/lib/*/libldap.so.2 ] || { echo "FATAL: libldap (untuk libcurl) hilang"; exit 1; }
            # Ultra compression (T-ML47): rootfs (dengan git) repacked ke
            # xz BCJ+LZMA2-9e, kepemilikan dipaksa root:root seperti tarball
            # asli ubuntu-base.
            tar -C "$ROOTFS" -cf - --owner=0 --group=0 . \
              | xz -T0 --filters="$XZFILT" > app/src/main/assets/env/ubuntu-rootfs.tar.xz
            rm -rf "$ROOTFS"
            # Node runtime ramping (T-ML46, 33MB -> 26MB): unduh tarball
            # resmi (sha terpin), lalu (1) strip --strip-unneeded bin/node —
            # hanya seksi non-alloc (debug/symtab) yang hilang; BuildID,
            # PT_LOAD, dan NEEDED terbukti identik; (2) buang include/
            # (header C), lib/ (npm + corepack — server nol-npm & bundle Pi
            # self-contained), share/ (doc/man), dan symlink npm/npx.
            # RuntimeController hanya butuh bin/node di /usr/local/bin.
            NODE_URL="https://nodejs.org/dist/v$NODEVER/node-v$NODEVER-linux-$NODEARCH.tar.xz"
            for i in 1 2 3; do
              curl -sSL --retry 3 -o /tmp/node-official.tar.xz "$NODE_URL" && break || { echo "retry node ($i)"; sleep 5; }
            done
            echo "$(node_sha "$NODEVER" "$NODEARCH")  /tmp/node-official.tar.xz" | sha256sum -c -
            rm -rf /tmp/node-x && mkdir -p /tmp/node-x
            tar -xJf /tmp/node-official.tar.xz -C /tmp/node-x
            ND="/tmp/node-x/node-v$NODEVER-linux-$NODEARCH"
            [ -x "$ND/bin/node" ] || { echo "FATAL: bin/node hilang dari tarball resmi"; exit 1; }
            case "$NODEARCH" in
              arm64)  STRIP_BIN="aarch64-linux-gnu-strip" ;;
              armv7l) STRIP_BIN="arm-linux-gnueabihf-strip" ;;
              x64)    STRIP_BIN="strip" ;;
            esac
            "$STRIP_BIN" --strip-unneeded "$ND/bin/node"
            rm -rf "$ND/include" "$ND/lib" "$ND/share" "$ND/bin/npm" "$ND/bin/npx"
            # T-ML47: CHANGELOG.md + README.md are dead weight in a headless
            # runtime tar (LICENSE stays); compress with the same per-arch
            # BCJ+LZMA2-9e chain as the rootfs.
            rm -f "$ND/CHANGELOG.md" "$ND/README.md"
            tar -C /tmp/node-x -cf - "node-v$NODEVER-linux-$NODEARCH" \
              | xz -T0 --filters="$XZFILT" > app/src/main/assets/env/node-runtime.tar.xz
            ls -l app/src/main/assets/env/

            VC=$(( N * 10 + IDX ))
            TARGETS="assembleRelease"
            if [ "$IDX" = "1" ]; then TARGETS="assembleDebug assembleRelease"; fi
            ./gradlew --no-daemon $TARGETS \
              -Pabi="$ABI" \
              -PguestTriplet="$TRIPLET" \
              -PnodeVersion="$NODEVER" \
              -PappVersionCode="$VC" \
              -PappVersionName="$VERSION"
            cp app/build/outputs/apk/release/app-release.apk "coding-sachet-$VERSION-$N-$ABI.apk"
            if [ "$IDX" = "1" ]; then
              cp app/build/outputs/apk/debug/app-debug.apk "coding-sachet-debug-$N.apk"
            fi
          done
          ls -l coding-sachet-*.apk

      - name: Verify APK signatures + baked git
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          for APK in coding-sachet-*.apk; do
            echo "--- $APK"
            "$APKSIGNER" verify --print-certs "$APK" | head -3
          done
          # The rootfs asset shipped inside every release APK must carry git
          # (T-ML31 P0-3) — prove it from the artifact itself, not from the
          # build log. T-ML47 proves the DEEP slim contract from the built
          # APK: perl (incl. perl-base) / gconv / apt / dpkg / systemd /
          # udev / share-fat trees ABSENT; the closure-critical libs
          # (libsystemd for ps/top, libldap+libsasl2 for libcurl, libgcrypt,
          # libcrypto, libcurl-gnutls) PRESENT; usr/sbin trimmed to
          # ldconfig; node tar stripped to bin/node + LICENSE (no docs).
          for APK in coding-sachet-1.0.*.apk; do
            RLIST=$(unzip -p "$APK" assets/env/ubuntu-rootfs.tar.xz | xz -dc | tar -tf -)
            grep -q '^\./usr/bin/git$' <<<"$RLIST" \
              || { echo "FATAL: rootfs di $APK tanpa /usr/bin/git"; exit 1; }
            grep -qE '^\./usr/lib/git-core/git$' <<<"$RLIST" \
              || { echo "FATAL: git-core hilang dari $APK"; exit 1; }
            grep -qE '^\./usr/bin/(ps|bash)$' <<<"$RLIST" \
              || { echo "FATAL: ps/bash hilang dari $APK"; exit 1; }
            for KEEP in libsystemd.so.0 libldap.so.2 libsasl2.so.2 libgcrypt.so.20 libcrypto.so.3 libcurl-gnutls.so.4; do
              grep -qE "^\./usr/lib/[^/]+/$KEEP" <<<"$RLIST" \
                || { echo "FATAL: $KEEP hilang dari $APK (closure-critical)"; exit 1; }
            done
            if grep -qE '^\./usr/(lib/[^/]+/(perl|perl-base|gconv)|share/(perl|perl5|doc|man|locale)|lib/(apt|dpkg|systemd|udev)|share/ca-certificates)/' <<<"$RLIST"; then
              echo "FATAL: pohon gemuk T-ML47 masih ada di rootfs $APK"; exit 1
            fi
            if grep -E '^\./usr/sbin/.' <<<"$RLIST" | grep -qvE 'ldconfig'; then
              echo "FATAL: usr/sbin belum ramping di $APK"; exit 1
            fi
            NLIST=$(unzip -p "$APK" assets/env/node-runtime.tar.xz | xz -dc | tar -tf -)
            grep -qE '^node-v[^/]+-linux-[^/]+/bin/node$' <<<"$NLIST" \
              || { echo "FATAL: bin/node hilang dari $APK"; exit 1; }
            if grep -qE '^node-v[^/]+/(lib|include|share)/' <<<"$NLIST"; then
              echo "FATAL: payload npm/include/doc masih ada di node tar $APK"; exit 1
            fi
            if grep -qE '^node-v[^/]+/(CHANGELOG|README)' <<<"$NLIST"; then
              echo "FATAL: CHANGELOG/README masih ada di node tar $APK"; exit 1
            fi
            echo "$APK: rootfs ramping T-ML47 terverifikasi (git+ps+closure libs utuh, $(wc -l <<<"$RLIST") entri; node tar $(wc -l <<<"$NLIST") entri)"
          done

      - name: Prepare release files
        run: |
          set -e
          for APK in coding-sachet-1.0.*.apk coding-sachet-debug-*.apk; do
            sha256sum "$APK" > "$APK.sha256"
          done
          ls -l coding-sachet-*

      - name: Publish GitHub Release (tag beta)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="beta"
          NOTES="Coding Sachet beta build ${{ github.run_number }} — split ABI APKs (arm64-v8a, armeabi-v7a, x86_64). Ubuntu 24.04 + Node.js + git bundled inside the APK (xz ultra compression, no first-run downloads). Providers: APInex (https://api.apinex.bond/v1), NVIDIA NIM (https://integrate.api.nvidia.com/v1), 100milionseek (https://100milionseek.top/v1) & NgodeAI (https://llm.ngodeai.net/v1). Chat: copy / edit-and-resend buttons under every message (long-press menu removed); tool calls as compact single-line rows."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Coding Sachet beta build ${{ github.run_number }}" --notes "$NOTES" --prerelease
          fi
          # Replace whatever the previous build left under this tag.
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r A; do
            if [ -n "$A" ]; then gh release delete-asset "$TAG" "$A" --yes; fi
          done
          gh release upload "$TAG" \
            coding-sachet-1.0.*.apk \
            coding-sachet-1.0.*.apk.sha256 \
            coding-sachet-debug-*.apk \
            coding-sachet-debug-*.apk.sha256
          gh release edit "$TAG" --title "Coding Sachet beta build ${{ github.run_number }}" --notes "$NOTES"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
