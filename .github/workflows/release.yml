name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-agent:
    # The Node agent server is the heart of the app: run its test suite first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Agent server tests (mock gateway)
        run: |
          cd app/src/main/assets/server
          node --test test/*.test.js

  apk:
    needs: test-agent
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          set -e
          AH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$AH/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$AH/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKM="sdkmanager"
          else
            mkdir -p "$AH/cmdline-tools/latest"
            curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/ctl.zip
            unzip -q /tmp/ctl.zip -d /tmp/ctl
            mv /tmp/ctl/cmdline-tools/* "$AH/cmdline-tools/latest/"
            SDKM="$AH/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37.0" > /dev/null
          "$SDKM" --install "build-tools;37.0.0" > /dev/null 2>&1 || echo "build-tools;37.0.0 tidak tersedia — AGP akan pakai versi default"
          [ -d "$AH/platforms/android-37.0" ] || { echo "FATAL: platform android-37.0 tidak terpasang"; exit 1; }
          echo "ANDROID_HOME=$AH" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}"
            } > keystore/keystore.properties
          else
            echo "No signing secrets: the release APK will be debug-signed (still installable)."
          fi

      - name: Prepare bundled environment (ultra compression, xz)
        run: |
          set -e
          mkdir -p app/src/main/assets/env
          UB_URL="https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.5-base-arm64.tar.gz"
          UB_SHA="a91d5a93010193712d346d761372b7c9db6dfcf093893161c64ca107f05914f2"
          NODE_URL="https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-arm64.tar.xz"
          NODE_SHA="406fe3fbde1c054adff8b297c16fdb5af6659db327c1ac8acd46b56ef1af9a92"
          for i in 1 2 3; do
            curl -sSL --retry 3 -o /tmp/ubuntu.tar.gz "$UB_URL" && break || { echo "retry ubuntu ($i)"; sleep 5; }
          done
          echo "$UB_SHA  /tmp/ubuntu.tar.gz" | sha256sum -c -
          # Ultra compression: pristine rootfs repacked from gzip to xz -9e
          # (~30 MB gz -> ~17 MB xz). Node ships an official .tar.xz already.
          gunzip -c /tmp/ubuntu.tar.gz | xz -9e -T0 > app/src/main/assets/env/ubuntu-24.04.5-arm64.tar.xz
          for i in 1 2 3; do
            curl -sSL --retry 3 -o app/src/main/assets/env/node-26.13.0-linux-arm64.tar.xz "$NODE_URL" && break || { echo "retry node ($i)"; sleep 5; }
          done
          echo "$NODE_SHA  app/src/main/assets/env/node-26.13.0-linux-arm64.tar.xz" | sha256sum -c -
          ls -l app/src/main/assets/env/

      - name: Build APKs
        run: |
          ./gradlew --no-daemon assembleDebug assembleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Prepare release files
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK_NAME="poket-coding-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "poket-coding-debug-${GITHUB_RUN_NUMBER}.apk"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" \
            "$APK_NAME" \
            "$APK_NAME.sha256" \
            "poket-coding-debug-${{ github.run_number }}.apk" \
            --title "Poket Coding build ${{ github.run_number }}" \
            --notes "Poket Coding — Ubuntu 24.04 (proot) + Node agent server, environment bundled in-APK (xz, no first-run downloads). Providers: APInex (https://api.apinex.bond/v1, free/ models) & NVIDIA NIM (https://integrate.api.nvidia.com/v1, free prototyping)." \
            --prerelease || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: poket-coding-${{ github.run_number }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
            poket-coding-debug-${{ github.run_number }}.apk
          retention-days: 30
