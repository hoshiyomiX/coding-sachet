name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-agent:
    # The Node agent server is the heart of the app: run its test suite first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Agent server tests (mock gateway)
        run: |
          cd app/src/main/assets/server
          node --test test/*.test.js

  apk:
    needs: test-agent
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          set -e
          AH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -x "$AH/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$AH/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKM="sdkmanager"
          else
            mkdir -p "$AH/cmdline-tools/latest"
            curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/ctl.zip
            unzip -q /tmp/ctl.zip -d /tmp/ctl
            mv /tmp/ctl/cmdline-tools/* "$AH/cmdline-tools/latest/"
            SDKM="$AH/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37.0" > /dev/null
          "$SDKM" --install "build-tools;37.0.0" > /dev/null 2>&1 || echo "build-tools;37.0.0 tidak tersedia — AGP akan pakai versi default"
          [ -d "$AH/platforms/android-37.0" ] || { echo "FATAL: platform android-37.0 tidak terpasang"; exit 1; }
          echo "ANDROID_HOME=$AH" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kotlin unit tests
        # App-logic tests (providers, wire format, localization parity) run
        # BEFORE any APK is assembled — a red test must fail the build early.
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build one APK per ABI (split ABI)
        run: |
          set -e
          N="$GITHUB_RUN_NUMBER"
          VERSION="1.0.$N"
          #        ABI            guest triplet          node ver   node arch  verCode idx
          MATRIX="arm64-v8a|aarch64-linux-gnu|26.13.0|arm64|1
          armeabi-v7a|arm-linux-gnueabihf|22.20.0|armv7l|2
          x86_64|x86_64-linux-gnu|26.13.0|x64|3"
          #          rootfs arch | ubuntu-base 24.04.5 sha256
          ubuntu_sha() {
            case "$1" in
              arm64) echo a91d5a93010193712d346d761372b7c9db6dfcf093893161c64ca107f05914f2 ;;
              armhf) echo 4fcee4d278f1c5232e085a021a85e4c6cef3853557a88d98ff380b5e5d5841bb ;;
              amd64) echo e77b6f10c2590cef872b33ee9f635a0e3fd1f57fb074c0e52b5c7f56147a0c86 ;;
            esac
          }
          #          node tarball sha256 (versi+arch)
          node_sha() {
            case "$1/$2" in
              26.13.0/arm64)  echo 406fe3fbde1c054adff8b297c16fdb5af6659db327c1ac8acd46b56ef1af9a92 ;;
              26.13.0/x64)    echo d28a96af6c38596f6d9d97c0ee531c13d238d757742387d1928de822d959e997 ;;
              22.20.0/armv7l) echo c599a33d91c9a39b7de3319929948f91f6ac42afaa1417f4340a5cc1b2efceda ;;
            esac
          }

          echo "$MATRIX" | while IFS='|' read -r ABI TRIPLET NODEVER NODEARCH IDX; do
            [ -n "$ABI" ] || continue
            case "$ABI" in
              arm64-v8a)    UB_ARCH=arm64 ;;
              armeabi-v7a)  UB_ARCH=armhf ;;
              x86_64)       UB_ARCH=amd64 ;;
            esac
            echo "===== ABI $ABI (rootfs $UB_ARCH, node v$NODEVER-$NODEARCH, idx $IDX) ====="
            mkdir -p app/src/main/assets/env
            UB_PATH="ubuntu-base/releases/24.04/release/ubuntu-base-24.04.5-base-$UB_ARCH.tar.gz"
            UB_WANT="$(ubuntu_sha "$UB_ARCH")"
            UB_OK=""
            # cdimage.ubuntu.com went DNS-dark from GitHub runners on
            # 2026-11-11 (3 runs in 12 minutes, "Could not resolve host"
            # every attempt while other hosts resolved fine) — the tarball
            # is sha256-pinned per attempt, so any mirror serving the same
            # bytes is safe: canonical host first, then verified mirrors.
            for HOST in cdimage.ubuntu.com mirrors.tuna.tsinghua.edu.cn/ubuntu-cdimage mirrors.ustc.edu.cn/ubuntu-cdimage; do
              for i in 1 2; do
                if curl -sSL --connect-timeout 20 --max-time 240 -o /tmp/ubuntu.tar.gz "https://$HOST/$UB_PATH" \
                   && echo "$UB_WANT  /tmp/ubuntu.tar.gz" | sha256sum -c -; then
                  UB_OK="$HOST"; break 2
                fi
                echo "retry ubuntu via $HOST ($i)"; sleep 5
              done
            done
            [ -n "$UB_OK" ] || { echo "FATAL: ubuntu-base $UB_ARCH gagal dari semua mirror"; exit 1; }
            echo "ubuntu-base $UB_ARCH dari $UB_OK"
            # Bake git into the rootfs (T-ML31 P0-3): 6/6 field server-kills
            # started with the model running apt to install git (dpkg
            # maintainer scripts = peak memory under proot -> kernel OOM
            # killer picks node). git + its runtime library closure are
            # RESOLVED against this very rootfs's dpkg status (apt with Dir
            # overrides — no chroot/qemu needed), downloaded, and extracted
            # with dpkg-deb -x --root-ownergroup: no maintainer scripts ever
            # run, no dpkg state is touched, the guest just gets /usr/bin/git.
            ROOTFS=/tmp/rootfs-$UB_ARCH
            mkdir -p "$ROOTFS"
            tar -xzf /tmp/ubuntu.tar.gz -C "$ROOTFS"
            mkdir -p "$ROOTFS/var/lib/apt/lists/partial" "$ROOTFS/var/cache/apt/archives/partial"
            # Keyring dari rootfs itu sendiri (deterministik, tanpa sudo):
            # ubuntu-base selalu membawa ubuntu-archive-keyring.gpg.
            TRUSTED="$ROOTFS/usr/share/keyrings/ubuntu-archive-keyring.gpg"
            [ -f "$TRUSTED" ] || { echo "FATAL: keyring ubuntu hilang dari rootfs"; exit 1; }
            cat > /tmp/git-sources.list <<EOF
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main universe
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports noble main universe
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe
          EOF
            APTOPTS=( -o Dir="$ROOTFS"
              -o Dir::State::status="$ROOTFS/var/lib/dpkg/status"
              -o Dir::Etc::sourcelist=/tmp/git-sources.list
              -o Dir::Etc::sourceparts=-
              -o Dir::Etc::trusted="$TRUSTED"
              -o Dir::Etc::trustedparts=-
              -o APT::Architecture="$UB_ARCH"
              -o APT::Architectures="$UB_ARCH"
              -o Acquire::Languages=none )
            for i in 1 2 3; do
              apt-get "${APTOPTS[@]}" update && break || { echo "retry apt update ($i)"; sleep 5; }
            done
            apt-get "${APTOPTS[@]}" install -y --no-install-recommends --download-only git
            set -- "$ROOTFS"/var/cache/apt/archives/*.deb
            echo "git closure: $# paket"
            [ "$#" -ge 5 ] || { echo "FATAL: closure git < 5 paket"; exit 1; }
            for deb in "$@"; do dpkg-deb -x --root-owner-group "$deb" "$ROOTFS"; done
            # Purge EVERYTHING apt left behind: the downloaded .debs, the
            # lock, and above all pkgcache.bin/srcpkgcache.bin — the runner's
            # apt 2.7 builds those ~99 MB binary caches inside Dir::Cache
            # (run #31 shipped them: rootfs asset 75 MB instead of ~30 MB).
            # The pristine archives/partial skeleton is recreated after.
            rm -rf "$ROOTFS"/var/cache/apt/*
            mkdir -p "$ROOTFS"/var/cache/apt/archives/partial
            rm -rf "$ROOTFS"/var/lib/apt/lists/*
            [ -x "$ROOTFS/usr/bin/git" ] || { echo "FATAL: /usr/bin/git tidak ada di rootfs"; exit 1; }
            [ -d "$ROOTFS/usr/lib/git-core" ] || { echo "FATAL: /usr/lib/git-core hilang"; exit 1; }
            # Ultra compression: rootfs (dengan git) repacked ke xz -9e,
            # kepemilikan dipaksa root:root seperti tarball asli ubuntu-base.
            tar -C "$ROOTFS" -cf - --owner=0 --group=0 . | xz -9e -T0 > app/src/main/assets/env/ubuntu-rootfs.tar.xz
            rm -rf "$ROOTFS"
            NODE_URL="https://nodejs.org/dist/v$NODEVER/node-v$NODEVER-linux-$NODEARCH.tar.xz"
            for i in 1 2 3; do
              curl -sSL --retry 3 -o app/src/main/assets/env/node-runtime.tar.xz "$NODE_URL" && break || { echo "retry node ($i)"; sleep 5; }
            done
            echo "$(node_sha "$NODEVER" "$NODEARCH")  app/src/main/assets/env/node-runtime.tar.xz" | sha256sum -c -
            ls -l app/src/main/assets/env/

            VC=$(( N * 10 + IDX ))
            TARGETS="assembleRelease"
            if [ "$IDX" = "1" ]; then TARGETS="assembleDebug assembleRelease"; fi
            ./gradlew --no-daemon $TARGETS \
              -Pabi="$ABI" \
              -PguestTriplet="$TRIPLET" \
              -PnodeVersion="$NODEVER" \
              -PappVersionCode="$VC" \
              -PappVersionName="$VERSION"
            cp app/build/outputs/apk/release/app-release.apk "coding-sachet-$VERSION-$N-$ABI.apk"
            if [ "$IDX" = "1" ]; then
              cp app/build/outputs/apk/debug/app-debug.apk "coding-sachet-debug-$N.apk"
            fi
          done
          ls -l coding-sachet-*.apk

      - name: Verify APK signatures + baked git
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          for APK in coding-sachet-*.apk; do
            echo "--- $APK"
            "$APKSIGNER" verify --print-certs "$APK" | head -3
          done
          # The rootfs asset shipped inside every release APK must carry git
          # (T-ML31 P0-3) — prove it from the artifact itself, not from the
          # build log.
          for APK in coding-sachet-1.0.*.apk; do
            unzip -p "$APK" assets/env/ubuntu-rootfs.tar.xz \
              | xz -dc | tar -tf - | grep -q '^\./usr/bin/git$' \
              || { echo "FATAL: rootfs di $APK tanpa /usr/bin/git"; exit 1; }
            echo "$APK: /usr/bin/git terbukti di dalam rootfs"
          done

      - name: Prepare release files
        run: |
          set -e
          for APK in coding-sachet-1.0.*.apk coding-sachet-debug-*.apk; do
            sha256sum "$APK" > "$APK.sha256"
          done
          ls -l coding-sachet-*

      - name: Publish GitHub Release (tag beta)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="beta"
          NOTES="Coding Sachet beta build ${{ github.run_number }} — split ABI APKs (arm64-v8a, armeabi-v7a, x86_64). Ubuntu 24.04 + Node.js + git bundled inside the APK (xz ultra compression, no first-run downloads). Providers: APInex (https://api.apinex.bond/v1) & NVIDIA NIM (https://integrate.api.nvidia.com/v1)."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Coding Sachet beta build ${{ github.run_number }}" --notes "$NOTES" --prerelease
          fi
          # Replace whatever the previous build left under this tag.
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r A; do
            if [ -n "$A" ]; then gh release delete-asset "$TAG" "$A" --yes; fi
          done
          gh release upload "$TAG" \
            coding-sachet-1.0.*.apk \
            coding-sachet-1.0.*.apk.sha256 \
            coding-sachet-debug-*.apk \
            coding-sachet-debug-*.apk.sha256
          gh release edit "$TAG" --title "Coding Sachet beta build ${{ github.run_number }}" --notes "$NOTES"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coding-sachet-${{ github.run_number }}
          path: |
            coding-sachet-1.0.*.apk
            coding-sachet-1.0.*.apk.sha256
            coding-sachet-debug-${{ github.run_number }}.apk
            coding-sachet-debug-${{ github.run_number }}.apk.sha256
          retention-days: 30
